name: Deploy to GitHub Pages

# Build and deploy the Vite app whenever main is updated.
on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual runs from the Actions tab

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build # outputs dist/ with base=/sats-arena/
        env:
          # "on" is QUOTED — unquoted on is a YAML boolean (true). These are not
          # secrets (public backend URL + a flag); the LNbits key lives only on the backend.
          VITE_LIGHTNING: "on"
          VITE_BACKEND_URL: "https://sats-arena-production.up.railway.app"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
