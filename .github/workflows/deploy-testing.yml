name: Deploy to GitHub Pages (TESTING)

# Build and deploy the TEST site whenever v3 is pushed.
# Guarded to the testing repo, so this same file in the live repo (where v3 also
# gets pushed during dev) runs but SKIPS — the live Pages site is never touched.
on:
  push:
    branches: [v3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the testing repo actually builds/deploys this.
    if: github.repository == 'developerofwebxr-oss/sats-arena-testing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build # base overridden for the testing repo path
        env:
          BASE_PATH: "/sats-arena-testing/"
          VITE_LIGHTNING: "on"
          VITE_BACKEND_URL: "https://sats-arena-production.up.railway.app"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'developerofwebxr-oss/sats-arena-testing'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
