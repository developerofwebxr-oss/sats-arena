<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sats Arena — Pay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #050508;
        color: #f7931a;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: 20px; letter-spacing: 0.14em; text-shadow: 0 0 10px #f7931a; }
      .sub { font-size: 12px; letter-spacing: 0.18em; opacity: 0.7; }
      #qr-card { background: #fff; padding: 12px; border-radius: 6px; line-height: 0; display: none; }
      #qr { width: 240px; height: 240px; }
      a#open {
        display: none; padding: 14px 26px; background: #f7931a; color: #000;
        font-size: 16px; font-weight: bold; letter-spacing: 0.08em; text-decoration: none;
        border-radius: 4px;
      }
      button {
        font-family: monospace; letter-spacing: 0.1em; cursor: pointer;
        background: transparent; color: #f7931a; border: 1px solid #f7931a;
        padding: 10px 20px;
      }
      #copy { display: none; }
      #status { font-size: 14px; letter-spacing: 0.08em; min-height: 20px; }
      #code-entry { display: none; flex-direction: column; gap: 10px; align-items: center; }
      #code-input {
        font-family: monospace; font-size: 22px; letter-spacing: 0.3em; text-align: center;
        text-transform: uppercase; width: 160px; padding: 10px; background: #111;
        color: #f7931a; border: 1px solid #f7931a; border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>⚡ SATS ARENA</h1>
    <div class="sub" id="code-line"></div>

    <div id="code-entry">
      <div class="sub">enter session code</div>
      <input id="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" />
      <button id="join">JOIN</button>
    </div>

    <div id="qr-card"><img id="qr" alt="Lightning invoice QR" /></div>
    <a id="open">⚡ OPEN IN WALLET</a>
    <button id="copy">COPY INVOICE</button>
    <div id="status"></div>

    <script type="module" src="/src/pay.js"></script>
  </body>
</html>
